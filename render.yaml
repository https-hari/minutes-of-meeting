# Render Blueprint: New -> Blueprint -> pick this repo. Secrets are asked for on first deploy.
services:
  - type: web
    name: minutes-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-server.txt && python -m app.warmup
    startCommand: uvicorn app.api.routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MODEL_BACKEND
        value: fastembed
      - key: MODEL_CACHE_DIR
        value: ./models_cache
      - key: AUTH_DISABLED
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
